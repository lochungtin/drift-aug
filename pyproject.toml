[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "drift-aug"
dynamic = ["version"]
description = "Diffeomorphic Regional Interpolation and extrapolation of Flow Trajectories: SVF-based data augmentation for segmentation."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Chung Tin Lo", email = "lochungtin@gmail.com" }]
license = "MIT"
license-files = ["LICEN[CS]E*"]
keywords = ["augmentation", "registration", "diffeomorphism", "segmentation", "mri"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
    "pyyaml>=6.0",
    "pyniftireg>=0.1.1",
]

[project.urls]
Homepage = "https://github.com/lochungtin/drift-aug"
Repository = "https://github.com/lochungtin/drift-aug.git"
"Bug Tracker" = "https://github.com/lochungtin/drift-aug/issues"
Changelog = "https://github.com/lochungtin/drift-aug/blob/main/CHANGELOG.md"

[project.optional-dependencies]
io = ["nibabel>=5.0", "SimpleITK>=2.3"]
# No Python deps: requires NiftyReg's reg_* binaries on PATH.
niftyreg = []
viz = ["matplotlib>=3.7", "imageio>=2.31"]
monai = ["monai>=1.3"]
torchio = ["torchio>=0.19"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "ipykernel>=6.0",
    "drift-aug[viz]",
]

[project.scripts]
drift = "drift.cli:main"

[tool.hatch.version]
source = "vcs"
# Untagged commits build as X.Y.Z.postN.devM (unique on TestPyPI).
raw-options = { version_scheme = "no-guess-dev", local_scheme = "no-local-version", fallback_version = "0.0.0" }

[tool.hatch.build.targets.wheel]
packages = ["src/drift"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.0.0"
tag_format = "v$version"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["nibabel.*", "SimpleITK.*", "imageio.*"]
ignore_missing_imports = true

# Optional frameworks: treated as untyped (Any) whether or not they are installed, so CI (which
# doesn't install them) and local runs agree.
[[tool.mypy.overrides]]
module = ["torchio.*", "monai.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["drift.integrations.*"]
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "niftyreg: requires NiftyReg reg_* binaries on PATH",
    "gpu: requires a CUDA device",
    "slow: takes minutes (real data); runs only with DRIFT_SLOW=1",
]

[tool.coverage.run]
source = ["drift"]
branch = true

[tool.coverage.report]
skip_empty = true
fail_under = 85
exclude_also = ["pragma: no cover", "if TYPE_CHECKING:"]
